# Fly.io — one small always-on machine in Frankfurt, TLS and a public hostname from Fly.
#
#   fly launch --no-deploy --copy-config --name <your-app-name>     # creates the app; keeps this file
#   fly secrets set TENSORX_API_KEY=…
#   fly deploy --ha=false
app = "minisakias"
primary_region = "fra"
# an answer streams for up to a couple of minutes: on a deploy the old machine gets SIGTERM and time to finish them
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[env]
  MINISAKIAS_REQUIRE_EU = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # one machine stays up: the first question after a cold start would wait for the corpus index on top of the model
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# the rate limit counts per machine, in memory: with more than one machine each keeps its own count
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

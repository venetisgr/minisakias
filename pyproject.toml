[project]
name = "minisakias"
version = "0.1.0"
description = "Μηνυσάκιας — νομικός προσανατολισμός για πολίτες: ο πολίτης περιγράφει το πρόβλημά του, ένας δρομολογητής βρίσκει τα σχετικά άρθρα των ελληνικών κωδίκων και ένας συντάκτης εξηγεί πώς μπορεί να κινηθεί νομικά. Ανοιχτά μοντέλα σε παρόχους εντός ΕΕ."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minisakias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
